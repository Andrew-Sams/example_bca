<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Projector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Savings Projector</h1>
  <div class="controls">
    <label>Initial Savings: <input id="initial" type="number" value="1000"></label>
    <label>Years: <input id="years" type="number" value="10"></label>
    <div id="bins">
      <h2>Growth Rate Bins</h2>
      <div class="bin">
        <input class="bin-name" placeholder="Name" value="Conservative">
        <input class="min-rate" type="number" placeholder="Min %" value="1">
        <input class="max-rate" type="number" placeholder="Max %" value="3">
        <button class="remove-bin">×</button>
      </div>
    </div>
    <button id="add-bin">Add Bin</button>
    <button id="simulate">Simulate</button>
  </div>
  <table id="results"></table>
  <script src="script.js"></script>
</body>
</html>
